    <script>
        // AJAX check for date+time availability
        $(function(){
            var checkTimeout = null;
            function checkAvailability(){
                var date = $('#date').val();
                var time = $('#time').val();
                if (!date || !time) { $('#availability').text(''); return; }
                $('#availability').text('Checking availability...');
                $.post('php/check_availability.php', { date: date, time: time }, function(resp){
                    try{ var j = (typeof resp === 'string') ? JSON.parse(resp) : resp; }
                    catch(e){ $('#availability').text('Error checking availability'); return; }
                    if (j.available) {
                        $('#availability').css('color','green').text('Slot available');
                    } else {
                        $('#availability').css('color','red').text('Slot already taken. Please choose another time.');
                    }
                });
            }
            $('#date, #time').on('change input', function(){
                if (checkTimeout) clearTimeout(checkTimeout);
                checkTimeout = setTimeout(checkAvailability, 350);
            });
        });
    </script>

        <div class="toast-msg" id="toast"></div>
        <script>
            // show toast if status in querystring
            (function(){
                function qs(name){
                    name = name.replace(/[\[]/,"\\[").replace(/[\]]/,"\\]");
                    var regex = new RegExp('[\\?&]'+name+'=([^&#]*)');
                    var results = regex.exec(location.search);
                    return results ? decodeURIComponent(results[1].replace(/\+/g, ' ')) : null;
                }
                var s = qs('status');
                var msg = document.getElementById('toast');
                if (s === 'success'){
                    msg.className = 'toast-msg';
                    msg.innerText = 'Appointment booked — we will confirm it.';
                    msg.style.display = 'block';
                    setTimeout(function(){ msg.style.display='none'; history.replaceState(null,'', location.pathname); }, 3500);
                } else if (s === 'error'){
                    msg.className = 'toast-msg toast-error';
                    var m = qs('msg') || 'Error booking appointment';
                    msg.innerText = m;
                    msg.style.display = 'block';
                    setTimeout(function(){ msg.style.display='none'; history.replaceState(null,'', location.pathname); }, 3500);
                }
            })();
        </script>
