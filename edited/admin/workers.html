<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <title>Employees Management Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="workers.css">
</head>
<body>
<div class="container my-4">
  <h2 class="mb-4">Employees</h2>
    <!-- Search & Filter Bar -->
    <form class="row g-2 mb-3">
        <div class="col-md-3">
            <input type="text" class="form-control" placeholder="Search by name...">
        </div>
        <div class="col-md-2">
            <select class="form-select">
                <option value="">All Positions</option>
                <option>Storekeeper</option>
                <option>Manager</option>
                <option>Security</option>
            </select>
        </div>
        <div class="col-md-2">
            <select class="form-select">
                <option value="">All Statuses</option>
                <option>Active</option>
                <option>Inactive</option>
                <option>On Leave</option>
                <option>Terminated</option>
            </select>
        </div>
        <div class="col-md-2">
            <select class="form-select">
                <option value="">All Stores</option>
                <option>Main Warehouse</option>
                <option>Secondary Store</option>
                <option>North Depot</option>
            </select>
        </div>
        <div class="col-md-3 text-end">
            <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#addWorkerModal">Add Employee</button>
        </div>
    </form>
  <!-- Employees Table -->
    <div class="card">
        <div class="card-header bg-primary text-white">
            Employees List
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th>Name</th>
                        <th>Position</th>
                        <th>Store</th>
                        <th>Contact</th>
                        <th>Status</th>
                        <th>Start Date</th>
                        <th>Probation End</th>
                        <th>Actions</th>
                    </tr>
                </thead>
        <tbody>
          <!-- No employees yet. Rows will appear here when data is added. -->
        </tbody>
            </table>
        </div>
    </div>

  <!-- Add Employee Modal -->
    <div class="modal fade" id="addWorkerModal" tabindex="-1" aria-labelledby="addWorkerLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form>
            <div class="modal-header">
              <h5 class="modal-title" id="addWorkerLabel">Add New Employee</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="mb-2">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" required>
              </div>
              <div class="mb-2">
                <label class="form-label">Photo URL</label>
                <input type="text" class="form-control">
              </div>
              <div class="mb-2">
                <label class="form-label">Position</label>
                <select class="form-select" required>
                  <option>Storekeeper</option>
                  <option>Manager</option>
                  <option>Security</option>
                </select>
              </div>
              <div class="mb-2">
                <label class="form-label">Store</label>
                <select class="form-select" required>
                  <option>Main Warehouse</option>
                  <option>Secondary Store</option>
                  <option>North Depot</option>
                </select>
              </div>
              <div class="mb-2">
                <label class="form-label">Contact</label>
                <input type="text" class="form-control" required>
              </div>
              <div class="mb-2">
                <label class="form-label">Status</label>
                <select class="form-select" required>
                  <option>Active</option>
                  <option>Inactive</option>
                  <option>On Leave</option>
                  <option>Terminated</option>
                </select>
              </div>
              <div class="mb-2">
                <label class="form-label">Start Date</label>
                <input type="date" class="form-control" required>
              </div>
              <div class="mb-2">
                <label class="form-label">Probation End Date</label>
                <input type="date" class="form-control">
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Add Employee</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  <!-- View Employee Modal (Optional) -->
    <div class="modal fade" id="viewWorkerModal" tabindex="-1" aria-labelledby="viewWorkerLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="viewWorkerLabel">Employee Details</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
              <div class="row">
                  <div class="col-md-3 text-center">
                      <img src="" class="avatar-lg mb-3 d-none" id="viewEmpPhoto">
                      <h6 id="viewEmpName" class="text-muted">(No employee selected)</h6>
                      <span class="badge bg-secondary d-none" id="viewEmpStatus"></span>
                  </div>
                  <div class="col-md-9">
                      <table class="table table-borderless">
                          <tr>
                              <th>Position:</th><td id="viewEmpPosition">-</td>
                          </tr>
                          <tr>
                              <th>Store:</th><td id="viewEmpStore">-</td>
                          </tr>
                          <tr>
                              <th>Contact:</th><td id="viewEmpContact">-</td>
                          </tr>
                          <tr>
                              <th>Start Date:</th><td id="viewEmpStart">-</td>
                          </tr>
                          <tr>
                              <th>Probation End:</th><td id="viewEmpProbation">-</td>
                          </tr>
                          <tr>
                              <th>Status:</th><td id="viewEmpStatusText">-</td>
                          </tr>
                          <tr>
                              <th>Notes:</th><td id="viewEmpNotes">-</td>
                          </tr>
                      </table>
                  </div>
              </div>
              <!-- Attendance and Status History could be tabs or tables here -->
          </div>
        </div>
      </div>
    </div>

  <!-- Attendance Checker -->
  <div class="card">
    <div class="card-header bg-success text-white d-flex align-items-center justify-content-between">
      <span>Attendance</span>
      <div class="d-flex gap-2">
        <input type="date" id="attDate" class="form-control form-control-sm">
        <button class="btn btn-light btn-sm" id="markAllPresent">Mark All Present</button>
        <button class="btn btn-outline-light btn-sm" id="clearAttendance">Clear</button>
      </div>
    </div>
    <div class="p-3">
      <div class="row g-2 mb-2">
        <div class="col-md-4">
          <input type="text" id="attSearch" class="form-control" placeholder="Search employee...">
        </div>
        <div class="col-md-8 text-end">
          <div class="btn-group btn-group-sm" role="group">
            <button class="btn btn-outline-success" data-status="Present">Present</button>
            <button class="btn btn-outline-warning" data-status="Late">Late</button>
            <button class="btn btn-outline-danger" data-status="Absent">Absent</button>
            <button class="btn btn-outline-secondary" data-status="Leave">Leave</button>
          </div>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0" id="attendanceTable">
          <thead>
            <tr>
              <th style="width:36px"><input type="checkbox" id="attSelectAll"></th>
              <th>Employee</th>
              <th>Position</th>
              <th>Store</th>
              <th>Status</th>
              <th>Time In</th>
              <th>Time Out</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody>
            <!-- Populated by JS from current table rows -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="workers_attendance.js"></script>
</body>
</html>
